# This workflow runs automatically on every Pull Request into `development` or `main`.
# Goal: catch obvious problems early, without blocking beginners over style issues.
name: Playwright Tests CI

# Trigger: runs only on Pull Requests targeting these two branches.
# Direct pushes to development/main are blocked by branch rules, so PRs are the only entry point.
on:
  pull_request:
    branches: [development, main]

# If someone pushes new commits to the same PR while a previous run is still going,
# cancel the old run and start a fresh one. Saves time and CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Code style check. Runs ESLint + Prettier, but does NOT block the merge.
  # We keep this informational (warn-only) because the team is learning.
  lint-and-format:
    runs-on: ubuntu-latest
    continue-on-error: true   # <-- this makes the job "advisory only", it will show a warning icon but won't block merging
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (style/logic checks)
        run: npm run lint

      - name: Run Prettier check (formatting)
        run: npm run format:check

  # JOB 2: TypeScript check. Non-strict mode for now, just confirms the code compiles.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the project
        run: npm run typecheck

  # JOB 3: The actual Playwright tests against the live Steam store.
  # This is the real gate. It must pass before merging.
  playwright-tests:
    needs: [typecheck]   # only runs if typecheck passed, saves time if code is broken
    runs-on: ubuntu-latest
    timeout-minutes: 30    # safety net: kill the job if Steam is slow/unresponsive
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests against Steam store
        run: npx playwright test
        env:
          CI: true   # tells playwright.config.ts to enable retries (2 retries) and reduce workers

      # Always upload the report, even if tests failed, so the team can see WHY
      - name: Upload test report (always, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14